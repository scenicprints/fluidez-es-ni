name: Build content pack

# Edit a lesson, commit, done. This validates every file and rebuilds the
# bundled pack the app downloads, so publishing content never needs an app
# release — and a stray comma fails loudly here instead of quietly on
# everybody's phone.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '!content/pack.json'
      - '!content/version.json'
      - '.github/workflows/build-pack.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pack
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every JSON file
        run: |
          set -e
          fail=0
          for f in $(find content -name '*.json'); do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" \
              || { echo "::error file=$f::not valid JSON"; fail=1; }
          done
          exit $fail

      - name: Build the pack
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M)+$(git rev-parse --short HEAD)"
          # fluidez-es-ni -> es-ni
          CODE="${{ github.event.repository.name }}"
          CODE="${CODE#fluidez-}"
          echo "Building $CODE $VERSION"
          python .github/scripts/build-pack.py --root . --language "$CODE" --version "$VERSION"

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- content/pack.json content/version.json; then
            echo "Pack unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/pack.json content/version.json
          git commit -m "Rebuild content pack [skip ci]"
          git push
